name: Auto Shorts Cloud
on:
  workflow_dispatch:
    inputs:
      topic: { description: 'Custom Topic', required: false, default: '' }
      subject: { description: 'Subject', required: false, default: '' }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core && pip install requests fpdf2 && npm install msedge-tts
      - env:
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUD_NAME: ${{ secrets.CLOUD_NAME }}
          CLOUD_API_KEY: ${{ secrets.CLOUD_API_KEY }}
          CLOUD_API_SECRET: ${{ secrets.CLOUD_API_SECRET }}
          GMAIL: ${{ secrets.GMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          BLOGGER_EMAIL: ${{ secrets.BLOGGER_EMAIL }}
          BLOG_URL: ${{ secrets.BLOG_URL }}
          CUSTOM_TOPIC: ${{ github.event.inputs.topic }}
          CUSTOM_SUBJ: ${{ github.event.inputs.subject }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: python -u cloud_shorts.py
